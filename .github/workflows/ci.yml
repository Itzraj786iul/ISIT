name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Run from repo root where package.json + package-lock.json live.
# If the app lives in a subfolder on GitHub, set `defaults.run.working-directory` to that path.
defaults:
  run:
    working-directory: .

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # Uses `eslint .` — Next.js 16 removed the `next lint` CLI subcommand.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholders so Next.js can compile (no DB/OpenAI needed for build)
          MONGO_URI: mongodb://127.0.0.1:27017/ci
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
